<title>Коммит: 3D-просмотр</title>
<style>
:root{--bg:#fff;--fg:#111413;--mut:#6b726d;--card:rgba(255,255,255,.92);--line:rgba(17,20,19,.12);--acc:#1f9d55}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;width:100%;height:100%;min-height:360px;overflow:hidden;background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:grab}
#wrap.shelf canvas{touch-action:pan-y !important}   /* на полке жесты прокрутки отдаём странице-родителю */
canvas:active{cursor:grabbing}
#load{position:absolute;inset:0;display:grid;place-items:center;font:500 13px ui-monospace,Menlo,monospace;color:var(--mut);pointer-events:none;transition:opacity .4s}
#load.off{opacity:0}
#ui{position:absolute;left:0;right:0;bottom:0;padding:0 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#ui>*{pointer-events:auto}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.bar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 1px 6px rgba(17,20,19,.06)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:10px;padding:6px 12px;min-height:38px}
button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button:disabled{opacity:.35;cursor:default}
.nav{display:flex;align-items:center;gap:2px}
.nav{position:relative}
.nav .lbl{white-space:nowrap;min-width:176px;text-align:center;font:500 12px ui-monospace,Menlo,monospace;color:var(--mut);padding:6px 10px}
.nav .lbl::after{content:'';display:inline-block;margin-left:7px;width:0;height:0;border:4px solid transparent;border-bottom-color:currentColor;border-top:0;vertical-align:2px}
.nav .lbl[aria-expanded=true]{background:rgba(17,20,19,.06);color:var(--fg)}
#secmenu{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);min-width:236px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 6px 24px rgba(17,20,19,.14);display:none;z-index:6}
#secmenu.on{display:block}
#secmenu button{display:flex;justify-content:space-between;gap:16px;width:100%;text-align:left;font-size:13px;padding:7px 10px;min-height:34px}
#secmenu button span{color:var(--mut);font:500 11px ui-monospace,Menlo,monospace;align-self:center}
#secmenu button[aria-selected=true]{background:var(--fg);color:var(--bg)}
#secmenu button[aria-selected=true] span{color:inherit;opacity:.7}
.nav button{font-size:18px;line-height:1;width:44px;padding:0}
.sets{display:flex;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.sets::-webkit-scrollbar{display:none}
.sets button{white-space:nowrap;font-size:13px}
#insRow[hidden]{display:none}
#wrap.ins #marks{display:none}
#insBar .sep{width:1px;background:var(--line);margin:4px 6px;flex:none}
#insBar button:disabled{opacity:.35}
.sets button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.kits{display:flex;gap:2px;align-items:center;padding:6px 8px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.kits::-webkit-scrollbar{display:none}
.kits button{height:28px;min-height:28px;padding:0 10px 0 6px;border-radius:9px;border:0;background:transparent;display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;flex:none}
.kits button i{display:block;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
.kits button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.kits .seg{display:flex;gap:2px;margin-left:8px;padding-left:8px;border-left:1px solid var(--line);flex:none}
.kits .seg button{padding:0 10px}
@media (max-width:760px){.kits button span{display:none}.kits button{padding:0 6px}.kits .seg button span{display:inline}}
.tool{font-size:13px}
@media (max-width:520px){.nav .lbl{min-width:140px;padding:6px 6px}.nav button{width:40px}.sets button{padding:6px 10px}.tool .long{display:none}}
@media (min-width:521px){.tool .short{display:none}}
.row{flex-wrap:nowrap}
#tools{display:flex}
@media (max-width:520px){.row{flex-wrap:wrap}.tool{padding:6px 8px}}
#zoom{position:absolute;right:10px;top:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px}
#zoom button{width:34px;height:34px;min-height:34px;padding:0;font-size:18px;line-height:1}
#zoom .zs{position:relative;width:34px;height:132px}
#zoom input{position:absolute;left:50%;top:50%;width:120px;margin:0;transform:translate(-50%,-50%) rotate(-90deg);accent-color:#111413;cursor:pointer}
#marks{position:absolute;right:10px;top:270px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:4}
.mk{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 6px rgba(17,20,19,.08);animation:mkin .35s ease-out}
.mk .go{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 8px;min-height:34px;font:600 12px ui-monospace,Menlo,monospace}
.mk i{display:block;width:10px;height:18px;border-radius:2px 2px 0 0;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.mk .x{width:28px;min-height:34px;padding:0;color:var(--mut);font-size:16px}
@keyframes mkin{from{opacity:0;transform:translateX(26px)}}
@media (max-width:520px){#marks{right:6px}.mk .go{font-size:11px;padding:4px 4px 4px 6px;min-height:30px}.mk .x{min-height:30px;width:24px}}
#toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-8px);max-width:min(86%,420px);background:#111413;color:#fff;padding:8px 14px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center;z-index:5}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:520px){#zoom{right:6px;top:8px}#zoom .zs{height:100px}#zoom input{width:90px}}
#toShelf{position:absolute;left:12px;top:12px;z-index:4;display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 6px rgba(17,20,19,.08)}
#wrap.book #toShelf{display:block}
#shelfHint{position:absolute;left:0;right:0;top:16px;text-align:center;font:500 14px system-ui,sans-serif;color:var(--mut);pointer-events:none;display:none;z-index:2}
#wrap.shelfidle #shelfHint{display:block}
#shelfBtns{position:absolute;inset:0;z-index:3;pointer-events:none;display:none}
#wrap.shelfidle #shelfBtns{display:block}
#shelfBtns button{position:absolute;pointer-events:auto;background:transparent;border:0;padding:0;min-height:0;border-radius:2px;cursor:pointer}
#shelfBtns button:focus-visible{outline:2px solid #1F9D55;outline-offset:2px}
#ui{transition:opacity .6s,visibility .6s}
#wrap.shelf #ui{opacity:0;visibility:hidden;pointer-events:none}
#wrap.shelf #zoom,#wrap.shelf #marks{display:none}
@media (max-height:600px){#marks{top:10px!important;right:64px;flex-direction:row;align-items:flex-start}#zoom .zs{height:70px}.sets button{padding:6px 10px}.kits{padding:3px 6px}}
@media (max-height:600px) and (min-width:521px){.kits .seg{margin-left:4px;padding-left:4px}.kits button{padding:0 4px}.kits button span{display:none}.kits .seg button span{display:inline}}

<div id="wrap">
  <canvas id="c" tabindex="0" aria-label="Ежедневник «Коммит» в 3D. Стрелки влево и вправо листают страницы."></canvas>

</div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from './vendor/OrbitControls.js';

/* ---------- данные ---------- */
const SETS=[
 {n:'Веб и бэкенд',kit:'a',tag:'web · backend'},{n:'Данные и ML',kit:'h',tag:'data · ml'},{n:'Инфраструктура',kit:'d',tag:'infra · sre'},
 {n:'Мобильная и игры',kit:'e',tag:'mobile · games'},{n:'Качество и безопасность',kit:'f',tag:'qa · security'},{n:'Руководители',kit:'b',tag:'lead · mgmt'}];
// ключ a,b,d,e,f,h — «Основной», с суффиксом i — «Конверсия» (обложка и корешок меняются местами)
// bg: цвет обложки, sp: цвет корешка (= полоска, резинка, петля), acc: набор акцента на страницах
const KITS={
 a:{n:'Графит',bg:'#101412',sp:'#4FD283',tx:'#0C120F',ac:'#0C120F',acc:'green'},
 b:{n:'Сланец',bg:'#2B2F36',sp:'#E2B04A',tx:'#2B2F36',ac:'#2B2F36',acc:'ochre'},
 d:{n:'Кобальт',bg:'#2F5BEA',sp:'#E6EDFF',tx:'#1D3A9E',ac:'#2F5BEA',acc:'blue'},
 e:{n:'Петроль',bg:'#0B2D33',sp:'#FF9A4D',tx:'#0B2D33',ac:'#0B2D33',acc:'amber'},
 f:{n:'Чернильная',bg:'#0F1E3D',sp:'#7FB0FF',tx:'#0F1E3D',ac:'#0F1E3D',acc:'sky'},
 h:{n:'Фиолетовая',bg:'#1F1147',sp:'#A57CFF',tx:'#1F1147',ac:'#1F1147',acc:'violet'},
 ai:{n:'Графит',bg:'#4FD283',sp:'#101412',tx:'#4FD283',ac:'#4FD283',acc:'green'},
 bi:{n:'Сланец',bg:'#E2B04A',sp:'#2B2F36',tx:'#F1EEE6',ac:'#F1EEE6',acc:'ochre'},
 di:{n:'Кобальт',bg:'#E6EDFF',sp:'#2F5BEA',tx:'#FFFFFF',ac:'#FFFFFF',acc:'blue'},
 ei:{n:'Петроль',bg:'#FF9A4D',sp:'#0B2D33',tx:'#EAF6F7',ac:'#EAF6F7',acc:'amber'},
 fi:{n:'Чернильная',bg:'#7FB0FF',sp:'#0F1E3D',tx:'#EAF0FF',ac:'#EAF0FF',acc:'sky'},
 hi:{n:'Фиолетовая',bg:'#A57CFF',sp:'#1F1147',tx:'#F3EEFF',ac:'#F3EEFF',acc:'violet'}};
const NSP=27;            // разворотов в просмотре (макет v5, 272 стр.)
const NL=NSP-1;          // листов
const q=new URLSearchParams(location.search);
const TEX=q.get('tex')||'./tex';
const SITE=q.get('look')==='site';   // ?look=site: холодный серый декор полки для сайта
const BGQ=(q.get('bg')||'').replace('#','');
if(/^[0-9a-fA-F]{6}$/.test(BGQ))document.documentElement.style.setProperty('--bg','#'+BGQ);
const TV='?v=40';   // версия текстур: при замене картинок поднять, чтобы браузер не отдавал старые из кэша

/* ---------- размеры, см ---------- */
const W=14.8,H=21.0,CB=0.22,TB=1.4,T=TB+2*CB,PWD=14.5,PHT=20.5,R_CORNER=0.45;
const Y0=-T/2+CB;

/* ---------- состояние ---------- */
let set=Math.min(5,Math.max(0,+(q.get('set')||0)));
let kit=KITS[q.get('kit')]?q.get('kit'):SETS[set].kit;
let f=0,target=0,backFlip=0,backTarget=0;
let dirty=true;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- сцена ---------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'low-power'});
renderer.setClearColor(0,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(28,1,8,420);
const controls=new OrbitControls(camera,canvas);
controls.enableZoom=false;controls.enablePan=false;controls.enableDamping=true;controls.dampingFactor=.09;
controls.minPolarAngle=.15;controls.maxPolarAngle=1.32;controls.rotateSpeed=.7;
controls.addEventListener('change',()=>dirty=true);
scene.add(new THREE.AmbientLight(0xffffff,1.55));
const sun=new THREE.DirectionalLight(0xffffff,1.65);sun.position.set(-10,26,16);scene.add(sun);
const fill=new THREE.DirectionalLight(0xffffff,.35);fill.position.set(14,6,-10);scene.add(fill);

const lift=new THREE.Group();scene.add(lift);
const pivot=new THREE.Group();lift.add(pivot);
const book=new THREE.Group();pivot.add(book);

/* контактная тень */
{
 const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
 const g=x.createRadialGradient(64,64,6,64,64,64);g.addColorStop(0,'rgba(20,24,22,.62)');g.addColorStop(.5,'rgba(20,24,22,.26)');g.addColorStop(1,'rgba(0,0,0,0)');
 x.fillStyle=g;x.fillRect(0,0,128,128);
 var shadow=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
 shadow.rotation.x=-Math.PI/2;shadow.position.y=-T/2-.03;shadow.renderOrder=-1;pivot.add(shadow);
}

/* ---------- текстуры ---------- */
// Загрузка без рывков: декодирование картинки вне основного потока, на видеокарту грузим по одной текстуре за кадр,
// старые текстуры остаются на книге, пока новые не готовы.
const maxAniso=Math.min(8,renderer.capabilities.getMaxAnisotropy());
const cache=new Map();            // url -> {url,tex,state}
let loadQ=[],upQ=[],loading=0;
const MAXLOAD=2;
const accKey=()=>KITS[kit].acc;
const spreadUrl=i=>`${TEX}/g${set}/${accKey()}/s${String(i).padStart(2,'0')}.webp${TV}`;
const frontUrl=()=>`${TEX}/g${set}/covers/front_${kit}.webp${TV}`;
const backUrl=()=>`${TEX}/back/back_${kit}.webp${TV}`;
function pump(){
 while(loading<MAXLOAD&&loadQ.length){
  const e=loadQ.shift();loading++;e.state='loading';
  const im=new Image();im.decoding='async';im.src=e.url;
  (im.decode?im.decode():new Promise((ok,no)=>{im.onload=ok;im.onerror=no}))
   .then(()=>{const t=new THREE.Texture(im);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=maxAniso;e.tex=t;e.state='decoded';upQ.push(e)})
   .catch(()=>{e.state='error';cache.delete(e.url)})
   .finally(()=>{loading--;pump()});
 }
}
function req(url){
 let e=cache.get(url);
 if(!e){e={url,tex:null,state:'queued'};cache.set(url,e);loadQ.push(e);}
 return e;
}
function currentSpreadIndex(){return Math.max(0,Math.min(NSP-1,Math.round(f)-1))}
let wantedUrls=new Set(),wantedOrder=[];
function manageTex(){
 const c=currentSpreadIndex(),order=[frontUrl(),backUrl()];
 const idxs=[c,c+1,c-1,c+2,c-2,c+3,0];
 if(f>NSP-4)idxs.push(NSP-1);
 for(const i of idxs)if(i>=0&&i<NSP)order.push(spreadUrl(i));
 wantedOrder=order;wantedUrls=new Set(order);
 // убираем из очереди то, что уже не нужно
 loadQ=loadQ.filter(e=>{if(wantedUrls.has(e.url))return true;cache.delete(e.url);return false});
 order.forEach(u=>req(u));
 const rank=new Map(order.map((u,k)=>[u,k]));
 // порядок: сначала обложка и текущий разворот; обложку не показываем раньше, чем нужна
 loadQ.sort((a,b)=>rank.get(a.url)-rank.get(b.url));
 pump();
}
function uploadOne(){
 const e=upQ.shift();if(!e)return false;
 if(!wantedUrls.has(e.url)){e.tex.dispose();cache.delete(e.url);return true}
 e.tex.needsUpdate=true;renderer.initTexture(e.tex);e.state='ready';applyTex();return true;
}
function gc(){
 const used=new Set([coverMat.map,backMat.map,innerFMat.map,innerBMat.map]);
 for(const L of leaves){used.add(L.mF.map);used.add(L.mB.map)}
 for(const [u,e] of cache){
  if(e.state==='ready'&&!wantedUrls.has(u)&&!used.has(e.tex)){e.tex.dispose();cache.delete(u)}
 }
}
let readyFlag=false;
function pick(url,cur,keep){
 const e=cache.get(url);
 if(e&&e.state==='ready')return e.tex;
 return keep?cur:null;
}

/* ---------- материалы ---------- */
const paperEdge=(()=>{
 const c=document.createElement('canvas');c.width=4;c.height=64;const x=c.getContext('2d');
 for(let i=0;i<16;i++){x.fillStyle=i%2?'#f1f1ef':'#ffffff';x.fillRect(0,i*4,4,4)}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t;
})();
const edgeMat=new THREE.MeshLambertMaterial({color:0xffffff,map:paperEdge});
const boardMat=new THREE.MeshLambertMaterial({color:KITS[kit].bg});
const spineMat=new THREE.MeshLambertMaterial({color:KITS[kit].sp});
const coverMat=new THREE.MeshLambertMaterial({color:0xffffff});
const backMat=new THREE.MeshLambertMaterial({color:0xffffff});
const innerFMat=new THREE.MeshLambertMaterial({color:0xffffff,alphaTest:.5});
const innerBMat=new THREE.MeshLambertMaterial({color:0xffffff,alphaTest:.5});
const blockMatR=new THREE.MeshLambertMaterial({color:0xffffff,map:paperEdge});

/* ---------- обложки (доски) ---------- */
function roundedShape(){
 const s=new THREE.Shape(),r=R_CORNER;
 s.moveTo(0,-H/2);s.lineTo(W-r,-H/2);s.quadraticCurveTo(W,-H/2,W,-H/2+r);
 s.lineTo(W,H/2-r);s.quadraticCurveTo(W,H/2,W-r,H/2);s.lineTo(0,H/2);s.closePath();return s;
}
function faceGeo(upFacing,mirrorU,half){ // half: -1 лево, 1 право, 0 вся
 const g=new THREE.ShapeGeometry(roundedShape(),6);
 const p=g.attributes.position,uv=g.attributes.uv;
 for(let i=0;i<p.count;i++){
  const x=p.getX(i),y=p.getY(i);
  let u=x/W; if(mirrorU)u=1-u;
  if(half===-1)u=u*.5; else if(half===1)u=.5+u*.5;
  uv.setXY(i,u,upFacing?(y+H/2)/H:(H/2-y)/H);
 }
 if(upFacing)g.rotateX(-Math.PI/2); else g.rotateX(Math.PI/2);
 return g;
}
function boardEdgeGeo(){
 const g=new THREE.ExtrudeGeometry(roundedShape(),{depth:CB,bevelEnabled:false,curveSegments:6});
 g.rotateX(-Math.PI/2);g.translate(0,-CB/2,0);return g;
}
const eg=boardEdgeGeo();
const FRONT_Y=T/2-CB/2,BACK_Y=-T/2+CB/2;

// передняя доска
const frontBoard=new THREE.Group();
{
 const e=new THREE.Mesh(eg,boardMat);frontBoard.add(e);
 const o=new THREE.Mesh(faceGeo(true,false,0),coverMat);o.position.y=CB/2+.004;frontBoard.add(o);
 const i=new THREE.Mesh(faceGeo(false,true,-1),innerFMat);i.position.y=-CB/2-.004;frontBoard.add(i);
 frontBoard.userData.inner=i;
}
const frontPivot=new THREE.Group();frontPivot.add(frontBoard);frontBoard.position.y=FRONT_Y;book.add(frontPivot);
// задняя доска
const backBoard=new THREE.Group();
{
 const e=new THREE.Mesh(eg,boardMat);backBoard.add(e);
 const i=new THREE.Mesh(faceGeo(true,false,1),innerBMat);i.position.y=CB/2+.004;backBoard.add(i);
 const o=new THREE.Mesh(faceGeo(false,true,0),backMat);o.position.y=-CB/2-.004;backBoard.add(o);

 camera.position.copy(SHELF_T).addScaledVector(SHELF_DIR,60);camera.lookAt(SHELF_T);
 resize();camera.position.copy(SHELF_T).addScaledVector(SHELF_DIR,camGoal);camera.lookAt(SHELF_T);controls.update();
 dirty=true;
}
function enterBookState(){
 mode='book';wrapEl.classList.remove('shelf','shelfidle');wrapEl.classList.add('book');
 lift.visible=true;lift.position.set(0,0,0);lift.quaternion.copy(Q_ID);bookHidden(false);
 for(const g of ribbons)rinit[0]=rinit[1]=false;
 shelfG.visible=false;
 camTarget.set(0,0,0);controls.target.set(0,0,0);controls.enableRotate=true;
 pk=0;shelfPending=false;
 resize();camera.position.copy(BOOK_DIR).multiplyScalar(camGoal);camera.lookAt(camTarget);controls.update();dirty=true;
}
function choose(i){
 if(mode!=='shelf')return;
 setSet(i,true);pkSet=i;rinit[0]=rinit[1]=false;
 savedMarks=[marks[0],marks[1]];marks[0]=marks[1]=0;slotMark[0]=slotMark[1]=0;sv[0]=sv[1]=0;marksReleased=false;
 if(reduce){mode='book';enterBookState();return}
 camR0=camera.position.distanceTo(controls.target);camR1=fitFor(BOOK_DIR,_z0.set(0,0,0),'book')/zoom;
 mode='pick';pk=0;pkDir=1;pickWait=0;wrapEl.classList.remove('shelfidle','shelf');wrapEl.classList.add('book');
 shelfBooks[i].visible=false;lift.visible=true;lift.position.copy(shelfPos[i]);lift.quaternion.copy(shelfQ[i]);poseLift(0,i);bookHidden(true);
 dirBook.copy(BOOK_DIR);
 dirty=true;
}
const _z0=new THREE.Vector3();
function startReturn(){
 insClose(true);zoom=1;zr.value=z2v(1);
 pkSet=set;camR1=camera.position.distanceTo(controls.target);camR0=fitFor(SHELF_DIR,SHELF_T,'shelf');mode='return';pk=1;pkDir=-1;
 wrapEl.classList.add('shelf');wrapEl.classList.remove('book');
 dirBook.copy(camera.position).sub(controls.target).normalize();
 resetShelfPoses();shelfBooks[pkSet].visible=false;setShelfFade(0);
 bookHidden(true);resize();dirty=true;
}
function toShelf(){
 if(mode!=='book')return;
 insClose(true);
 if(reduce){goTo(0);backTarget=0;penTarget=0;bandTarget=0;f=target=0;backFlip=0;penT=0;bandT=0;enterShelfState();return}
 goTo(0);backTarget=0;backB.setAttribute('aria-pressed','false');penTarget=0;bandTarget=0;pendingOpen=null;shelfPending=true;updateTools();dirty=true;
}
function enterBookInstant(){
 if(mode==='pick'){pk=1}
 else if(mode==='shelf'){enterBookState()}
}
function stepShelf(dt){
 // возвращает true, если нужен кадр
 let moving=false;
 if(shelfPending&&mode==='book'&&f===0&&target===0&&backFlip===0&&penT===0&&bandT===0){shelfPending=false;startReturn()}
 if(mode==='pick'||mode==='return'){
  const e=cache.get(frontUrl()),rdy=e&&e.state==='ready';
  pk+=pkDir*dt/(PICK_MS/1000);
  if(mode==='pick'&&pk>=.2&&!rdy&&pickWait<1.5){pk=.2;pickWait+=dt}
  moving=true;
  if(mode==='pick'&&pk>=1){pk=1;poseLift(1,pkSet);poseCam(1);if(!marksReleased){marksReleased=true;for(let k=0;k<2;k++){marks[k]=savedMarks[k];slotMark[k]=savedMarks[k]}}enterBookState();canvas.focus({preventScroll:true});return true}
  if(mode==='return'&&pk<=0){pk=0;shelfBooks[pkSet].visible=true;enterShelfState();return true}
  poseLift(pk,pkSet);poseCam(pk);setShelfFade(cl(1-(pk-.55)/.35));
  shadow.material.opacity=cl((pk-.7)/.3);
  if(mode==='pick'&&!marksReleased&&pk>=.8){marksReleased=true;for(let k=0;k<2;k++){marks[k]=savedMarks[k];slotMark[k]=savedMarks[k]}}
  shelfBooks.forEach((g,j)=>{if(j!==pkSet)g.visible=true});
 }
 if(mode==='shelf'){
  shelfBooks.forEach((g,i)=>{
   const tgt=hoverI===i&&!reduce?.8:0,cur=g.position.z-shelfPos[i].z;
   if(Math.abs(tgt-cur)>.005){g.position.z=shelfPos[i].z+cur+(tgt-cur)*(1-Math.exp(-dt*18));moving=true}
   else if(cur!==tgt){g.position.z=shelfPos[i].z+tgt;moving=true}
   shelfSp[i].emissive.setScalar(hoverI===i?.08:0);
  });
 }
 return moving;
}
document.getElementById('toShelf').onclick=toShelf;
addEventListener('keydown',e=>{if(e.key==='Escape')escMenuWasOn=secMenu.classList.contains('on')},true);
let escMenuWasOn=false;
addEventListener('keydown',e=>{
 if(e.key==='Escape'&&mode==='book'&&!escMenuWasOn){toShelf();return}
 if(mode==='shelf'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){
  const i=shelfBtnEls.indexOf(document.activeElement),n=i<0?(e.key==='ArrowRight'?0:5):(i+(e.key==='ArrowRight'?1:5))%6;
  shelfBtnEls[n].focus();e.preventDefault();
 }
});

/* ---------- старт ---------- */
reloadAll();renderMarks();
if(q.get('open'))target=Math.min(NSP,Math.max(0,+q.get('open')));
if(target>0){bandT=bandTarget=1}
f=target;
camera.position.set(14,30,34);camera.lookAt(camTarget);
resize();
camera.position.set(14,30,34).setLength(camGoal);camera.lookAt(camTarget);controls.update();
wrapEl.classList.add('book');
if(START_SHELF)enterShelfState();else shelfG.visible=false;
requestAnimationFrame(tick);
// публичный API для лендинга: window.kommit3d
window.kommit3d={ins:o=>{enterBookInstant();insOpen(o||{})},insClose:()=>insClose(false),insState:()=>({kind:insKind,size:insSize,face:insFace,p:insP}),insSetP:v=>{insTarget=v;insP=v;insPose();dirty=true},pick:pickRibbon,shelfHit,hit:(x,y)=>wheelOverBook({target:canvas,clientX:x,clientY:y}),dbg:()=>({camR1,fit:fitDistance(),goal:camGoal,ui:uiH(),d:camera.position.distanceTo(controls.target),mode,zoom}),go:n=>{enterBookInstant();go(n)},setSet:(i,u)=>{enterBookInstant();setSet(i,u)},setKit,open:n=>{enterBookInstant();goTo(n)},zoom:z=>{enterBookInstant();setZoom(z)},shelf:toShelf,choose,get mode(){return mode}};
</script>
